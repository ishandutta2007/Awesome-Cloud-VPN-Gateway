<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }

      .animated-bg-node { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
      .floating-card { animation: float 6s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- Dynamic Network Graphic Elements (Positioned safely on sides and background) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="40" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-bg-node"/>
    <circle cx="150" cy="80" r="8" fill="#38bdf8"/>
    <line x1="150" y1="80" x2="300" y2="220" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <circle cx="1050" cy="220" r="60" fill="none" stroke="#c084fc" stroke-width="2" class="animated-bg-node"/>
    <circle cx="1050" cy="220" r="10" fill="#c084fc"/>
    <line x1="1050" y1="220" x2="900" y2="80" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <circle cx="900" cy="80" r="6" fill="#38bdf8"/>
    <circle cx="300" cy="220" r="6" fill="#c084fc"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" />

  <!-- Center Content Frame (Title & Subtitle in foreground, cleanly separated) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Category Tag -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="-64" class="badge-text" text-anchor="middle">⚡ ZERO TRUST &amp; CLOUD ACCESS</text>

    <!-- Main Title -->
    <text x="0" y="0" class="title" filter="url(#glow)">Awesome Cloud VPN Gateway 🌐</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle">Curated SaaS Platforms, Zero Trust (ZTNA) &amp; Open-Source Mesh VPNs</text>
  </g>

  <!-- Bottom Accent Highlights -->
  <rect x="100" y="270" width="1000" height="2" fill="url(#accent)" opacity="0.4"/>
</svg>
